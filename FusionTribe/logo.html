<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FusionTribe Official Logo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,800;1,900&display=swap" rel="stylesheet">
    <style>
        /* This just makes the background dark so you can see the logo clearly */
        body { 
            background-color: #050505; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
    </style>
</head>
<body>

    <!-- THIS IS YOUR ACTUAL LOGO CODE -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" style="max-width: 700px;">
        
        <!-- Sharp Geometric Forward Icon (The 'Movement' Symbol) -->
        <g transform="translate(30, 50)">
            <polygon points="0,0 25,0 55,45 25,90 0,90 30,45" fill="#0066ff"/>
            <polygon points="35,0 60,0 90,45 60,90 35,90 65,45" fill="#ffffff"/>
        </g>

        <!-- FUSIONTRIBE Text -->
        <text x="145" y="115" font-family="'Inter', sans-serif" font-size="68" font-weight="900" font-style="italic" fill="#ffffff" letter-spacing="-2">FUSION</text>
        <text x="415" y="115" font-family="'Inter', sans-serif" font-size="68" font-weight="900" font-style="italic" fill="#0066ff" letter-spacing="-2">TRIBE</text>

        <!-- Slogan -->
        <text x="152" y="150" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#a3a3a3" letter-spacing="7.5">OUTRUN THE ORDINARY</text>
        
    </svg>
    <!-- END OF LOGO CODE -->

</body>
</html>
